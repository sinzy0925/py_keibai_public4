# public 鏡像用: ブロックを直列実行（normal → err-retry）
name: BIT pdf transcribe gemini 4

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: py-keibai-private-data-push
  cancel-in-progress: false

env:
  PRIVATE_REPO: sinzy0925/py_keibai
  PRIVATE_REF: main

jobs:
  transcribe-04_hokuriku:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ env.PRIVATE_REF }}
          path: app
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install Python packages
        working-directory: app
        run: pip install -r requirements.txt

      - name: Restore secrets and .env
        working-directory: app
        env:
          CLIENT_SECRET_JSON: ${{ secrets.client_secret_yoshinagataroai }}
          ENV_FILE: ${{ secrets._env }}
          GOOGLE_DRIVE_TOKEN: ${{ secrets.google_drive_token }}
        run: |
          set -euo pipefail
          mkdir -p secrets
          if [ -z "${CLIENT_SECRET_JSON}" ]; then
            echo "ERROR: Secret client_secret_yoshinagataroai が未設定です"
            exit 1
          fi
          if [ -z "${ENV_FILE}" ]; then
            echo "ERROR: Secret _env が未設定です"
            exit 1
          fi
          if [ -z "${GOOGLE_DRIVE_TOKEN}" ]; then
            echo "ERROR: Secret google_drive_token が未設定です"
            exit 1
          fi
          printf '%s' "$CLIENT_SECRET_JSON" > secrets/client_secret_yoshinagataroai.json
          printf '%s' "$GOOGLE_DRIVE_TOKEN" > secrets/google_drive_token.json
          printf '%s' "$ENV_FILE" > .env

      - name: Transcribe PDFs (04_hokuriku)
        id: transcribe
        continue-on-error: true
        working-directory: app
        run: |
          set -euo pipefail
          echo "Run: python pdf_transcribe_gemini.py --block 04_hokuriku --api-key 19-24 --pdf-source drive --limit 500 --gemini-wait 4 --pages-per-call 4"
          python pdf_transcribe_gemini.py \
            --block 04_hokuriku \
            --api-key 19-24 \
            --pdf-source drive \
            --limit 500 \
            --gemini-wait 4 \
            --pages-per-call 4

      - name: Commit transcript JSON (04_hokuriku)
        id: commit
        working-directory: app
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/blocks/04_hokuriku/transcripts/"
          if git diff --staged --quiet; then
            echo "No transcript changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(ci): update 04_hokuriku PDF transcripts (Gemini) [skip ci]"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Push to private with rebase
        if: steps.commit.outputs.committed == 'true'
        working-directory: app
        run: |
          set -euo pipefail
          branch="${PRIVATE_REF}"
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            git fetch origin "$branch"
            if ! git pull --rebase origin "$branch"; then
              git rebase --abort 2>/dev/null || true
              echo "::error::git rebase failed on private repo. Fix conflicts on py_keibai and re-run."
              exit 1
            fi
            if git push origin "HEAD:${branch}"; then
              echo "Pushed transcripts to ${PRIVATE_REPO} (${branch})."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}/${max_attempts}), retrying..."
            sleep "$((attempt * 5))"
          done
          echo "::error::git push to private failed after ${max_attempts} attempts."
          exit 1

      - name: Fail job if transcribe failed
        if: steps.transcribe.outcome == 'failure'
        run: |
          echo "::error::Transcribe step failed. Partial transcripts may have been committed and pushed."
          exit 1

